components:
  schemas:
    AccessEnum:
      enum:
      - 1
      - 2
      - 3
      type: integer
      description: |-
        * `1` - All users can see project tile and content and can participate (public).
        * `2` - All users can see project tile and content, only invited users can participate (semi-public).
        * `3` - Only invited users can see project tile and content and can participate (private).
    Account:
      type: object
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        username:
          type: string
          description: Required. 60 characters or fewer. Letters, digits, spaces and
            @/./+/-/_ only.
          pattern: ^[\w]+[ \w.@+-]*$
          maxLength: 60
        user_image:
          type: string
          format: uri
        user_image_fallback:
          type: string
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          title: Your preferred language
          description: |-
            Specify your preferred language for the user interface and the notifications of the platform.

            * `en` - English
            * `de` - German
            * `nl` - Dutch
            * `ky` - Kyrgyz
            * `ru` - Russian
      required:
      - pk
      - user_image_fallback
      - username
    Answer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        answer:
          type: string
          maxLength: 750
      required:
      - answer
      - id
    AppModule:
      type: object
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        active_phase:
          type: string
          readOnly: true
        future_phases:
          type: string
          readOnly: true
        past_phases:
          type: string
          readOnly: true
        labels:
          type: string
          readOnly: true
        categories:
          type: string
          readOnly: true
        has_idea_adding_permission:
          type: string
          readOnly: true
      required:
      - active_phase
      - categories
      - future_phases
      - has_idea_adding_permission
      - labels
      - past_phases
      - pk
    AppProject:
      type: object
      description: |-
        Mixin for serializers to convert a GeoDjango Point field into a GeoJSON feature.

        The Meta class of the serializer must define `geo_field` as the name of the model field
        containing the point data.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        point:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              items:
                type: number
                format: float
              example:
              - 12.9721
              - 77.5933
              minItems: 2
              maxItems: 3
          readOnly: true
          nullable: true
          title: Can your project be located on the map?
          description: Locate your project. Click inside the marked area or type in
            an address to set the marker. A set marker can be dragged when pressed.
        name:
          type: string
          title: Title of your project
          description: This title will appear on the teaser card and on top of the
            project detail page. It should be max. 120 characters long
          maxLength: 120
        url:
          type: string
          readOnly: true
        description:
          type: string
          title: Short description of your project
          description: This short description will appear on the header of the project
            and in the teaser. It should briefly state the goal of the project in
            max. 250 chars.
          maxLength: 250
        information:
          type: string
          readOnly: true
        result:
          type: string
          readOnly: true
        organisation:
          type: string
          readOnly: true
        organisation_logo:
          type: string
          readOnly: true
        published_modules:
          type: array
          items:
            type: string
          readOnly: true
        access:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          title: Header image
          description: The image will be shown as a decorative background image. It
            must be min. 1500 pixel wide and 500 pixel tall. Allowed file formats
            are png, jpeg, gif. The file size should be max. 5 MB.
        single_idea_collection_module:
          type: string
          readOnly: true
        single_poll_module:
          type: string
          readOnly: true
        participation_time_display:
          type: string
          readOnly: true
        module_running_progress:
          type: string
          readOnly: true
        has_contact_info:
          type: string
          readOnly: true
        contact_name:
          type: string
          title: Contact person
          maxLength: 120
        contact_address_text:
          type: string
          title: Postal address
        contact_phone:
          type: string
          title: Phone
          pattern: ^[\d\+\(\)\- ]{8,20}$
          maxLength: 20
        contact_email:
          type: string
          format: email
          title: Email
          maxLength: 254
        contact_url:
          type: string
          format: uri
          title: Website
          maxLength: 200
      required:
      - access
      - description
      - has_contact_info
      - information
      - module_running_progress
      - name
      - organisation
      - organisation_logo
      - participation_time_display
      - pk
      - point
      - published_modules
      - result
      - single_idea_collection_module
      - single_poll_module
      - slug
      - url
