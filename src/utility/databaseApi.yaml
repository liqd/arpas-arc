          description: ''
    post:
      operationId: api_contenttypes_objects_arpas_comments_create
      description: |-
        Allow anonymous users to access the view by creating a guest user.

        This mixin does not require overriding any attributes.

        Example usage:

        .. code:: python

            from guest_user.mixins import AllowGuestUserMixin

            class HelloWorldView(AllowGuestUserMixin, View):
                def get(self, request):
                    return HttpResponse(f"Hello {request.user.username}!")
      parameters:
      - in: path
        name: content_type
        schema:
          type: string
          pattern: ^[\d]+$
        required: true
      - in: path
        name: object_pk
        schema:
          type: string
          pattern: ^[\d]+$
        required: true
